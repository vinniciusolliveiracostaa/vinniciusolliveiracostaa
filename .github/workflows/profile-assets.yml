name: Generate profile assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - package.json
      - scripts/**
      - .github/workflows/profile-assets.yml
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: write

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate SVG assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check scripts
        run: npm run check:scripts

      - name: Generate profile assets
        run: npm run generate

      - name: Validate generated assets
        run: npm run check:assets

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
