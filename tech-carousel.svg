    <linearGradient id="fade-right-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

